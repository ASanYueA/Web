<!DOCTYPE html>
<html>
	<head>
		<meta charset="UTF-8">
		<title>古诗词网</title>
	</head>
	<body>
		<header>
			我是头部
		</header>
		<nav aria-label="主	导航">唐诗 宋词</nav>
		<main>
			<div id="poetry" style="background-color:#66CCFF;height:100%;width:70%;float: left;" align="center">
				<h1>学古诗</h1>
				<div>
					<div id="chunxiao" style="background-color:green">
						<h2>《春晓》</h2>
						<h3>孟浩然</h3>
						<p>春眠不觉晓，处处闻啼鸟。<br/>夜来风雨声，花落知多少。</p>
					</div>
					<div id="yonge" style="background-color:yellow">
						<h2>《咏鹅》</h2>
						<h3>骆宾王</h3>
						<p>鹅鹅鹅，曲项向天歌。<br/>白毛浮绿水，红掌拨清	波。</p>
					</div>
				</div>
			</div>
			<div id="jingyesi" style="background-color:lightblue;height:100%;width:30%;float: left;" align="center">
				<h2>《静夜思》</h2>
				<h3>李白</h3>
				<p>床前明月光，疑是地上霜。<br/>举头望明月，低头思故乡。</p>
			</div>
		</main>
		<hr/>
	</body>
</html>
