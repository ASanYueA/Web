<!DOCTYPE html>
<html>
	<head>
		<meta charset="UTF-8">
	</head>
	<body>
		<main>
            <form action="register" method="post">
                <label for="username">用户名:</label>
                <input type="text" id="username" name="username" required><br><br>
                <label for="password">密码:</label>
                <input type="password" id="password" name="password" required><br><br>
                <label for="email">邮箱:</label>
                <input type="email" id="email" name="email"><br><br>
                <label for="gender">性别:</label>
                <input type="radio" id="male" name="gender" value="male">
                <label for="male">男</label>
                <input type="radio" id="female" name="gender" value="female">
                <label for="female">女</label><br><br>
                <label for="checkbox">多选</label>
                <input type="checkbox" id="checkbox" name="checkbox" value="option1">
                <label for="option1">选项1</label>
                <input type="checkbox" id="checkbox" name="checkbox" value="option2">
                <label for="option2">选项2</label><br><br>
                <label for="date">日期</label>
                <input type="date" id="date" name="date"><br><br>
                <label for="image">图片</label>
                <input type="file" id="image" name="image"><br><br>
                <label for="search">搜索</label>
                <input type="search" id="search" name="search"><br><br>
                <label for="color">颜色</label>
                <input type="color" id="color" name="color"><br><br>
                <label for="range">滑块</label>
                <input type="range" id="range" name="range"><br><br>
                <label for="选择框">选择框：</label>
                <select name="dropdown" id="dropdown">
                    <option value="option1">选项1</option>
                    <option value="option2">选项2</option>
                    <option value="option3">选项3</option>
                </select><br><br>
                <input type="submit" value="注册">
                <input type="reset" value="重置"><br><br>
                <p>留言板：<br><textarea cols="30" rows="10" placeholder="请输入内容"></textarea><br><br></p>
            </form>
		</main>
	</body>
</html>
